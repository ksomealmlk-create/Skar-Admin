plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skar.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.skar.admin"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        skar {
            storeFile file('skar-release.jks')
            storeType 'pkcs12'
            storePassword 'F35rgO42EOtAcIO1xZf1'
            keyAlias 'skar'
            keyPassword 'F35rgO42EOtAcIO1xZf1'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.skar
        }
        release {
            signingConfig signingConfigs.skar
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
